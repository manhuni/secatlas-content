# The service reads the library from this repository. When a person changes an
# article and commits it, the pointer of the library moves to that commit and
# the service serves the new words within a minute.
#
# The file is written into the public repository by
# tools/publish_content_to_github.py --with-workflow. GitHub only accepts a
# workflow file from a token that carries the `workflow` scope.
name: Release the library

on:
  push:
    branches: [main]
    paths-ignore:
      - current.json

permissions:
  contents: write

concurrency:
  group: release-library
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the library
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The pointer of a release is not a new release
        id: guard
        env:
          MESSAGE: ${{ github.event.head_commit.message }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [[ "$MESSAGE" == release:* ]]; then
            echo "the pointer moved already"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A commit that carries only the machinery of the repository is not
          # a new library: the pointer of the library does not move.
          if git diff --name-only "$BEFORE" "$AFTER" | grep -qv '^\.github/'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "the commit carries only the machinery of the repository"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchronize catalog and validate JSON
        if: steps.guard.outputs.skip != 'true'
        run: |
          python3 sync_catalog.py
          python3 - <<'PY'
          import json, pathlib, sys
          broken = []
          for path in sorted(pathlib.Path('.').rglob('*.json')):
              if path.name == 'current.json':
                  continue
              try:
                  json.loads(path.read_text(encoding='utf-8'))
              except Exception as error:
                  broken.append(f'{path}: {error}')
          if broken:
              print('\n'.join(broken[:20]))
              sys.exit(1)
          print('the library is sound')
          PY

      - name: Commit catalog sync and point the service at this commit
        if: steps.guard.outputs.skip != 'true'
        run: |
          git config user.name 'SecAtlas'
          git config user.email 'noreply@github.com'
          if ! git diff --quiet -- catalog/ items/ content/; then
            git add catalog/ items/ content/
            git commit -m "catalog: sync from content"
          fi
          sha="$(git rev-parse HEAD)"
          printf '{\n  "schemaVersion": 1,\n  "release": "%s",\n  "updatedAt": ""\n}\n' "$sha" > current.json
          if git diff --quiet -- current.json; then
            echo "the pointer already names this commit"
            exit 0
          fi
          git add current.json
          git commit -m "release: $sha"
          git push
